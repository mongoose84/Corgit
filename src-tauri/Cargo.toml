[package]
name = "corgit"
version = "0.1.0"
description = "A fast dashboard over many local git repositories"
authors = ["Jeppe Kronborg"]
edition = "2021"
rust-version = "1.77.2"

[lib]
# The desktop binary in main.rs is a thin shim over this.
name = "corgit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.5.0"
# A second launch must route into the running process, never start a second one
# (§9.2). The guarantees in §7 — one 8-process git semaphore, one write queue
# per repo, one cache writer — are all process-local, so a second process does
# not merely duplicate work, it silently breaks them.
tauri-plugin-single-instance = "2.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
# Process fan-out for the status sweep, plus the semaphore that caps it (§7.3).
# "time" drives the focus-gated sweep ticker (§6); "io-util" pipes the commit
# message to `git commit -F -`'s stdin (§8.6).
tokio = { version = "1.49.0", features = ["process", "sync", "rt", "macros", "time", "io-util"] }
# std::fs::canonicalize returns \\?\C:\… on Windows, which is unfit both for
# display and for handing back to git. dunce strips the prefix when it is safe.
dunce = "1.0.5"
# FS watchers on hot repos (§6) — the mini debouncer does the "~200 ms
# debounce" the spec asks for without hand-rolled event coalescing.
notify = "6"
notify-debouncer-mini = "0.4"
# Release builds are `windows_subsystem = "windows"` (main.rs) — no console, so
# anything printed to stderr goes nowhere. A rotating file in the log dir is
# the only way a failure that happens on a user's machine leaves a trace.
tauri-plugin-log = "2.9.0"
log = "0.4.33"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
